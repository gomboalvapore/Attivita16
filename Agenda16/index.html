<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annota Attività</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Le Mie Attività Giornaliere</h1>
    <div class="grid-container">
        <div class="grid-item checkbox-item">
            <label for="activity1">Attività 1:</label>
            <input type="checkbox" id="activity1" name="activity1">
        </div>
        <div class="grid-item checkbox-item">
            <label for="activity2">Attività 2:</label>
            <input type="checkbox" id="activity2" name="activity2">
        </div>
        <div class="grid-item checkbox-item">
            <label for="activity3">Attività 3:</label>
            <input type="checkbox" id="activity3" name="activity3">
        </div>
        <div class="grid-item checkbox-item">
            <label for="activity4">Attività 4:</label>
            <input type="checkbox" id="activity4" name="activity4">
        </div>
        <div class="grid-item checkbox-item">
            <label for="activity5">Attività 5:</label>
            <input type="checkbox" id="activity5" name="activity5">
        </div>
        <div class="grid-item checkbox-item">
            <label for="activity6">Attività 6:</label>
            <input type="checkbox" id="activity6" name="activity6">
        </div>
        <div class="grid-item checkbox-item">
            <label for="activity7">Attività 7:</label>
            <input type="checkbox" id="activity7" name="activity7">
        </div>
        <div class="grid-item checkbox-item">
            <label for="activity8">Attività 8:</label>
            <input type="checkbox" id="activity8" name="activity8">
        </div>
        <div class="grid-item text-item">
            <label for="activity9">Attività 9:</label>
            <input type="text" id="activity9" name="activity9">
        </div>
        <div class="grid-item text-item">
            <label for="activity10">Attività 10:</label>
            <input type="text" id="activity10" name="activity10">
        </div>
        <div class="grid-item text-item">
            <label for="activity11">Attività 11:</label>
            <input type="text" id="activity11" name="activity11">
        </div>
        <div class="grid-item text-item">
            <label for="activity12">Attività 12:</label>
            <input type="text" id="activity12" name="activity12">
        </div>
        <div class="grid-title">
            <h2>Attività di gruppo</h2>
        </div>
        <div class="grid-item group-13-16">
            <label for="activity13">Attività 13:</label>
            <input type="text" id="activity13" name="activity13">
        </div>
        <div class="grid-item group-13-16">
            <label for="activity14">Attività 14:</label>
            <input type="text" id="activity14" name="activity14">
        </div>
        <div class="grid-item group-13-16">
            <label for="activity15">Attività 15:</label>
            <input type="text" id="activity15" name="activity15">
        </div>
        <div class="grid-item group-13-16">
            <label for="activity16">Attività 16:</label>
            <input type="text" id="activity16" name="activity16">
        </div>
    </div>

    <div class="reset-time">
        <label for="resetTime1_12">Orario Reset Attività 1-12:</label>
        <input type="time" id="resetTime1_12" name="resetTime1_12" value="00:00">
        <button id="resetButton1_12">Reset Attività 1-12</button>
    </div>

    <div class="reset-time">
        <label for="resetTime13_16">Orario Reset Attività 13-16:</label>
        <input type="time" id="resetTime13_16" name="resetTime13_16" value="00:00">
        <button id="resetButton13_16">Reset Attività 13-16</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
